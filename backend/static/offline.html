<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — ATS QIS</title>
    <link rel="icon" type="image/png" href="/static/img/logo.png" />
    <style>
      :root {
        --bg: #f8fafc;
        --text: #0f172a;
        --text-secondary: #475569;
        --card: #ffffff;
        --border: #e2e8f0;
        --primary: #4f46e5;
        --primary-shadow: rgba(79, 70, 229, 0.2);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --text: #ffffff;
          --text-secondary: #e2e8f0;
          --card: #18181b;
          --border: #334155;
          --primary: #6366f1;
          --primary-shadow: rgba(99, 102, 241, 0.3);
        }
      }
      /* Check custom setting theme if saved */
      html[data-theme="dark"] {
        --bg: #09090b;
        --text: #ffffff;
        --text-secondary: #e2e8f0;
        --card: #18181b;
        --border: #334155;
        --primary: #6366f1;
        --primary-shadow: rgba(99, 102, 241, 0.3);
      }
      html[data-theme="dark"] .logo {
        background-color: #ffffff;
        padding: 4px;
        border-radius: 8px;
      }
      html[data-theme="light"] {
        --bg: #f8fafc;
        --text: #0f172a;
        --text-secondary: #475569;
        --card: #ffffff;
        --border: #e2e8f0;
        --primary: #4f46e5;
        --primary-shadow: rgba(79, 70, 229, 0.2);
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 1.5rem;
        box-sizing: border-box;
      }

      .offline-card {
        background: var(--card);
        border: 1px solid var(--border);
        padding: 3rem 2rem;
        border-radius: 20px;
        box-shadow:
          0 10px 15px -3px rgba(0, 0, 0, 0.05),
          0 4px 6px -2px rgba(0, 0, 0, 0.02);
        max-width: 420px;
        width: 100%;
      }

      .logo {
        width: 72px;
        height: 72px;
        margin-bottom: 1.5rem;
        border-radius: 16px;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 800;
        margin: 0 0 0.5rem 0;
      }

      p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        line-height: 1.5;
        margin: 0 0 2rem 0;
      }

      .btn-retry {
        display: inline-block;
        background: var(--primary);
        color: white;
        border: none;
        padding: 0.75rem 1.75rem;
        font-size: 0.9rem;
        font-weight: 700;
        border-radius: 10px;
        cursor: pointer;
        text-decoration: none;
        box-shadow: 0 4px 10px var(--primary-shadow);
        transition:
          transform 0.2s,
          opacity 0.2s;
      }

      .btn-retry:active {
        transform: scale(0.98);
      }
    </style>
    <script>
      // Init theme dynamically to avoid flash
      const savedTheme = localStorage.getItem("inf-theme");
      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      }
    </script>
  </head>
  <body>
    <div class="offline-card">
      <img class="logo" src="/static/img/logo.png" alt="ATS Logo" />
      <h1>You are Offline</h1>
      <p>
        It looks like you've lost connection to the network. Don't worry, you
        can still view pages and documents you've visited recently.
      </p>
      <button class="btn-retry" onclick="window.location.reload()">
        Retry Connection
      </button>
    </div>
  </body>
</html>
